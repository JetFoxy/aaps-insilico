<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aaps-insilico — what-if</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css?v=20261123a">
  <link rel="stylesheet" href="whatif.css?v=20261123a">
</head>
<body>
<header>
  <div class="brand">
    <h1>aaps-insilico · what-if</h1>
    <span class="subtitle" data-i18n="whatif.subtitle"></span>
  </div>
  <div class="header-right">
    <a class="badge tab-link" href="index.html" data-i18n="whatif.back"></a>
    <span class="badge warn" data-i18n="whatif.warning.notPrediction"></span>
    <select id="lang" class="lang" aria-label="Language">
      <option value="ru">RU</option>
      <option value="en">EN</option>
    </select>
  </div>
</header>

<main>
  <section class="panel" id="connect-panel">
    <h2 data-i18n="whatif.connect.title"></h2>
    <p class="privacy" data-i18n="whatif.privacy"></p>
    <form id="connect-form" autocomplete="off">
      <label><span data-i18n="whatif.connect.url"></span>
        <input id="ns-url" type="url" required spellcheck="false" placeholder="https://nightscout.example"></label>
      <label><span data-i18n="whatif.connect.token"></span>
        <input id="ns-token" type="password" autocomplete="off" spellcheck="false"></label>
      <label><span data-i18n="whatif.connect.days"></span>
        <input id="ns-days" type="number" min="1" max="14" value="3"></label>
      <label><span data-i18n="whatif.connect.prefs"></span>
        <input id="prefs-file" type="file" accept=".json,application/json"></label>
      <label><span data-i18n="whatif.connect.password"></span>
        <input id="prefs-password" type="password" autocomplete="off" spellcheck="false"></label>
      <div class="form-actions">
        <button id="connect" class="primary" type="submit" data-i18n="whatif.connect"></button>
        <span id="connect-status" class="status" role="status"></span>
      </div>
    </form>
    <p class="note" id="connect-note" data-i18n="whatif.connect.hint"></p>
  </section>

  <section class="panel hidden" id="import-panel">
    <div class="panel-head">
      <h2 data-i18n="whatif.summary.title"></h2>
      <div class="panel-actions">
        <span id="import-status" class="status" role="status"></span>
        <button id="delete-import" type="button" class="danger" data-i18n="whatif.delete"></button>
      </div>
    </div>
    <div id="import-summary" class="summary"></div>
  </section>

  <section class="panel" id="mode-panel">
    <h2 data-i18n="whatif.mode.title"></h2>
    <div class="modes">
      <label class="mode-card" id="mode-replay-card">
        <input type="radio" name="mode" value="replay" checked>
        <span class="mode-name" data-i18n="whatif.mode.replay"></span>
        <span class="mode-hint" data-i18n="whatif.mode.replay.hint"></span>
      </label>
      <label class="mode-card" id="mode-model-card">
        <input type="radio" name="mode" value="model">
        <span class="mode-name" data-i18n="whatif.mode.model"></span>
        <span class="mode-hint" data-i18n="whatif.mode.model.hint"></span>
      </label>
    </div>
    <p class="note" id="mode-note"></p>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2 data-i18n="whatif.variants"></h2>
      <button id="add-variant" type="button" class="ghost" data-i18n="whatif.variant.add"></button>
    </div>
    <div id="variant-list" class="variant-list"></div>
  </section>

  <section class="panel">
    <div class="run-row">
      <button id="run" type="button" class="primary" data-i18n="whatif.run"></button>
      <span id="run-status" class="status" role="status"></span>
    </div>
  </section>

  <section class="panel hidden" id="results-panel">
    <div class="panel-head">
      <h2 data-i18n="whatif.results.title"></h2>
      <span id="results-badge" class="badge"></span>
    </div>
    <div class="legend" id="chart-legend">
      <span><i class="dot real"></i><span data-i18n="whatif.legend.real"></span></span>
      <span id="legend-model" class="hidden"><i class="dash model"></i><span data-i18n="whatif.legend.model"></span></span>
      <span><i class="dot smb"></i><span data-i18n="whatif.legend.smb"></span></span>
      <span><i class="dot iob"></i><span data-i18n="whatif.legend.iob"></span></span>
      <span><i class="band"></i><span data-i18n="whatif.legend.band"></span></span>
      <span id="variant-legend" class="variant-legend"></span>
    </div>
    <div class="chart-wrap">
      <svg id="chart" role="img" aria-label="what-if chart" preserveAspectRatio="none"></svg>
      <p class="note" id="chart-note"></p>
    </div>
    <div class="table-wrap">
      <table id="metrics-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="note" id="metrics-note"></p>
    <div class="not-reproduced">
      <h3 data-i18n="whatif.notReproduced.title"></h3>
      <p class="note" data-i18n="whatif.notReproduced.intro"></p>
      <ul id="not-reproduced-list"></ul>
    </div>
  </section>
</main>

<footer>
  <span data-i18n="whatif.footer"></span>
  <span><span data-i18n="footer.lang"></span>: <span id="footer-lang"></span></span>
</footer>

<script src="i18n.js?v=20261123a"></script>
<script src="whatif.js?v=20261123a"></script>
</body>
</html>
